server {
    listen 80;
    root /usr/share/nginx/html;
    # Backend rejects files over 5 MB; leave a little room for the form fields.
    client_max_body_size 6m;

    # ^~ so no regex location below can catch an API path.
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Files that name the current build must never be cached,
    # or phones keep running the old version after an update.
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
