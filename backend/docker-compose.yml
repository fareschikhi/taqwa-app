services:
  mysql:
    image: mysql:8.4
    container_name: taqwa_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: taqwa
      MYSQL_USER: taqwa_user
      MYSQL_PASSWORD: taqwa_password
    volumes:
      - mysql_data:/var/lib/mysql
    # The backend migrates on start, so it must wait until MySQL accepts
    # connections, not just until the container exists.
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-proot_password']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: .
    container_name: taqwa_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '3000:3000'
    # Uploaded images live on disk, so they need a volume to outlive a rebuild.
    volumes:
      - uploads:/app/uploads

volumes:
  mysql_data:
  uploads:
