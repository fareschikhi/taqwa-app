services:
  mysql:
    image: mysql:8.4
    container_name: taqwa_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: taqwa
      MYSQL_USER: taqwa_user
      MYSQL_PASSWORD: taqwa_password
    volumes:
      - mysql_data:/var/lib/mysql
    # The backend migrates on start, so it must wait until MySQL accepts
    # connections, not just until the container exists.
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-proot_password']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: .
    container_name: taqwa_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    # Only reachable from this machine; the internet goes through caddy.
    ports:
      - '127.0.0.1:3000:3000'
    # Uploaded images live on disk, so they need a volume to outlive a rebuild.
    volumes:
      - uploads:/app/uploads

  # Web UI for browsing the database. Bound to localhost only, since the
  # database still uses the default passwords; reach it remotely over SSH:
  #   ssh -L 8080:127.0.0.1:8080 you@server
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: taqwa_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
    ports:
      - '127.0.0.1:8080:80'

  # HTTPS in front of the API, at https://<subdomain>.duckdns.org. The router
  # forwards port 443 to this machine.
  caddy:
    build: ./caddy
    container_name: taqwa_caddy
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env.duckdns
    ports:
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates; keeping them avoids Let's Encrypt's rate limits.
      - caddy_data:/data

  # The ISP changes the public IP, so this points the DuckDNS name at the
  # current one every 5 minutes. Prints OK on success, KO on a bad token.
  duckdns:
    image: curlimages/curl:8.10.1
    container_name: taqwa_duckdns
    restart: unless-stopped
    env_file:
      - .env.duckdns
    entrypoint:
      - sh
      - -c
      - 'while true; do curl -fsS "https://www.duckdns.org/update?domains=$$DUCKDNS_SUBDOMAIN&token=$$DUCKDNS_TOKEN&ip="; echo; sleep 300; done'

volumes:
  mysql_data:
  uploads:
  caddy_data:
