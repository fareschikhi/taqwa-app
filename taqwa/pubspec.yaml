name: taqwa
description: "Taqwa - Quran Students Management Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  pretty_dio_logger: ^1.3.1
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  image_picker: ^1.1.2
  crypto: ^3.0.6
  shared_preferences: ^2.5.5
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

# Regenerate after changing the artwork: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/images/icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/icon_foreground.png
  # icon_foreground.png already carries the safe-zone margin.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#006B57"
