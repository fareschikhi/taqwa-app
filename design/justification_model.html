<!doctype html>

<html class="dark" dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>تبرير غياب - التقوى</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&amp;family=Tajawal:wght@500&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-low": "#f1f5f1",
              background: "#f6faf7",
              "secondary-container": "#a3ecf6",
              "surface-tint": "#006b57",
              "on-background": "#181d1b",
              "inverse-primary": "#7ed7bd",
              "inverse-on-surface": "#eef2ee",
              "on-error-container": "#93000a",
              "on-secondary-fixed": "#001f23",
              "primary-fixed-dim": "#7ed7bd",
              primary: "#006b57",
              "on-surface-variant": "#3e4945",
              "tertiary-fixed-dim": "#abccd5",
              tertiary: "#43636b",
              "on-secondary-fixed-variant": "#004f56",
              "surface-container-high": "#e5e9e6",
              "primary-container": "#7fd8be",
              "on-error": "#ffffff",
              secondary: "#146871",
              "error-container": "#ffdad6",
              "on-primary-container": "#005f4d",
              "on-primary": "#ffffff",
              "on-secondary": "#ffffff",
              "surface-container": "#ebefeb",
              "on-tertiary-container": "#38585f",
              "inverse-surface": "#2d312f",
              "surface-dim": "#d7dbd8",
              "surface-variant": "#dfe3e0",
              "on-tertiary": "#ffffff",
              "on-primary-fixed-variant": "#005141",
              "surface-bright": "#f6faf7",
              outline: "#6e7a75",
              "surface-container-highest": "#dfe3e0",
              "tertiary-fixed": "#c6e8f1",
              "secondary-fixed-dim": "#8ad2dc",
              "on-tertiary-fixed-variant": "#2b4b53",
              "surface-container-lowest": "#ffffff",
              "on-surface": "#181d1b",
              "on-primary-fixed": "#002019",
              surface: "#f6faf7",
              "primary-fixed": "#9af4d9",
              "tertiary-container": "#abcdd6",
              "on-tertiary-fixed": "#001f25",
              "outline-variant": "#bdc9c3",
              "on-secondary-container": "#1b6c75",
              "secondary-fixed": "#a6eef9",
              error: "#ba1a1a",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
              "2xl": "1.5rem",
            },
            spacing: {
              xl: "32px",
              xs: "4px",
              sm: "8px",
              "margin-desktop": "40px",
              lg: "24px",
              md: "16px",
              "2xl": "48px",
              "margin-mobile": "16px",
              gutter: "20px",
            },
            fontFamily: {
              "body-lg": ["Cairo"],
              "headline-lg-mobile": ["Cairo"],
              "headline-lg": ["Cairo"],
              "headline-md": ["Cairo"],
              "headline-sm": ["Cairo"],
              "body-md": ["Cairo"],
              "label-md": ["Tajawal"],
              "label-sm": ["Tajawal"],
              "display-lg": ["Cairo"],
            },
            fontSize: {
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "headline-lg-mobile": [
                "28px",
                { lineHeight: "38px", fontWeight: "700" },
              ],
              "headline-lg": [
                "32px",
                { lineHeight: "44px", fontWeight: "700" },
              ],
              "headline-md": [
                "24px",
                { lineHeight: "34px", fontWeight: "600" },
              ],
              "headline-sm": [
                "20px",
                { lineHeight: "28px", fontWeight: "600" },
              ],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "label-md": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.02em",
                  fontWeight: "500",
                },
              ],
              "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }],
              "display-lg": ["40px", { lineHeight: "56px", fontWeight: "700" }],
            },
          },
        },
      };
    </script>
    <style>
      /* Force Light Mode to adhere to guidelines */
      html {
        color-scheme: light;
      }
      .dark {
        color-scheme: light;
      }

      /* Modal Animation */
      @keyframes modalEnter {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .modal-animate {
        animation: modalEnter 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background min-h-screen text-on-background font-body-md overflow-hidden flex"
  >
    <!-- JUSTIFICATION MODAL OVERLAY -->
    <div
      class="fixed inset-0 z-[100] flex items-center justify-center bg-inverse-surface/40 backdrop-blur-[2px] p-4 transition-opacity duration-300"
      id="justification-modal"
    >
      <!-- Modal Container -->
      <div
        class="bg-surface-container-lowest w-full max-w-[480px] rounded-2xl shadow-[0px_12px_32px_rgba(18,52,59,0.08)] flex flex-col overflow-hidden modal-animate border border-surface-variant/50"
      >
        <!-- Header -->
        <div
          class="flex items-center justify-between px-lg py-md border-b border-surface-container-highest/60 bg-surface-bright/50"
        >
          <div class="flex items-center gap-sm">
            <div
              class="w-10 h-10 rounded-full bg-error-container/30 flex items-center justify-center text-error"
            >
              <span class="material-symbols-outlined">edit_calendar</span>
            </div>
            <div>
              <h2 class="text-headline-sm font-headline-sm text-on-surface">
                تبرير غياب
              </h2>
              <p
                class="text-label-sm font-label-sm text-on-surface-variant mt-0.5"
              >
                تقديم عذر لغياب الطالب
              </p>
            </div>
          </div>
          <button
            class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:text-error hover:bg-error-container/20 transition-colors focus:outline-none focus:ring-2 focus:ring-error/20"
            onclick="closeModal()"
          >
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <!-- Body -->
        <div class="p-lg flex flex-col gap-lg">
          <!-- Reason Dropdown -->
          <div class="flex flex-col gap-xs">
            <label
              class="text-label-md font-label-md text-on-surface-variant block"
              for="reason-type"
            >
              نوع العذر <span class="text-error">*</span>
            </label>
            <div class="relative">
              <select
                class="w-full appearance-none bg-surface-bright border border-outline-variant rounded-xl px-4 py-3 text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-container/30 transition-all cursor-pointer hover:border-outline"
                id="reason-type"
                onchange="handleReasonChange()"
              >
                <option disabled="" selected="" value="">
                  اختر نوع العذر من القائمة
                </option>
                <option value="مرض">مرض</option>
                <option value="مناسبة">مناسبة (عائلية، اجتماعية)</option>
                <option value="أخرى">أخرى</option>
              </select>
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none transition-transform group-focus-within:rotate-180"
                >expand_more</span
              >
            </div>
          </div>
          <!-- Conditional Text Field (Hidden by default) -->
          <div
            class="flex-col gap-xs hidden opacity-0 transition-all duration-300 transform -translate-y-2"
            id="other-reason-container"
          >
            <label
              class="text-label-md font-label-md text-on-surface-variant block"
              for="other-reason"
            >
              سبب الغياب بالتفصيل <span class="text-error">*</span>
            </label>
            <input
              class="w-full bg-surface-bright border border-outline-variant rounded-xl px-4 py-3 text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-container/30 transition-all hover:border-outline"
              id="other-reason"
              placeholder="يرجى توضيح العذر هنا..."
              type="text"
            />
          </div>
          <!-- Additional Notes -->
          <div class="flex flex-col gap-xs">
            <label
              class="text-label-md font-label-md text-on-surface-variant block"
              for="additional-notes"
            >
              ملاحظات إضافية
              <span class="text-outline text-label-sm font-label-sm"
                >(اختياري)</span
              >
            </label>
            <textarea
              class="w-full bg-surface-bright border border-outline-variant rounded-xl px-4 py-3 text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-container/30 transition-all resize-none hover:border-outline"
              id="additional-notes"
              placeholder="أضف أي تفاصيل أخرى قد تساعد الإدارة..."
              rows="3"
            ></textarea>
          </div>
        </div>
        <!-- Footer Actions -->
        <div
          class="px-lg py-md bg-surface-container-lowest border-t border-surface-container-highest/40 flex gap-md justify-end items-center mt-auto"
        >
          <button
            class="px-6 py-2.5 rounded-xl border border-outline-variant text-primary text-label-md font-label-md bg-surface-container-lowest hover:bg-surface-container-low focus:ring-4 focus:ring-outline-variant/20 transition-all"
            onclick="closeModal()"
          >
            إلغاء
          </button>
          <button
            class="px-8 py-2.5 rounded-xl bg-gradient-to-r from-primary to-surface-tint text-on-primary text-label-md font-label-md shadow-sm hover:shadow-md hover:translate-y-[-1px] focus:ring-4 focus:ring-primary-container transition-all flex items-center gap-2"
          >
            <span class="material-symbols-outlined text-[20px]">save</span>
            <span>حفظ العذر</span>
          </button>
        </div>
      </div>
    </div>
    <script>
      function handleReasonChange() {
        const select = document.getElementById("reason-type");
        const otherContainer = document.getElementById(
          "other-reason-container",
        );
        const otherInput = document.getElementById("other-reason");

        if (select.value === "أخرى") {
          otherContainer.classList.remove("hidden");
          // Use a tiny timeout to allow display:block to apply before animating opacity
          setTimeout(() => {
            otherContainer.classList.remove("opacity-0", "-translate-y-2");
            otherContainer.classList.add(
              "flex",
              "opacity-100",
              "translate-y-0",
            );
            otherInput.focus();
          }, 10);
        } else {
          otherContainer.classList.add("opacity-0", "-translate-y-2");
          otherContainer.classList.remove("opacity-100", "translate-y-0");
          // Wait for animation to finish before hiding
          setTimeout(() => {
            otherContainer.classList.add("hidden");
            otherContainer.classList.remove("flex");
            otherInput.value = ""; // clear value if hidden
          }, 300);
        }
      }

      function closeModal() {
        const modal = document.getElementById("justification-modal");
        const container = modal.querySelector(".modal-animate");

        // Reverse animation
        modal.style.opacity = "0";
        container.style.transform = "scale(0.95) translateY(10px)";

        setTimeout(() => {
          modal.style.display = "none";
        }, 300);
      }
    </script>
  </body>
</html>
