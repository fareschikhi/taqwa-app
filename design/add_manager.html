<!DOCTYPE html>

<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إضافة مدير حلقة</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&amp;family=Tajawal:wght@500&amp;display=swap" rel="stylesheet"/>

                        "tertiary": "#43636b",
                        "on-secondary-fixed-variant": "#004f56",
                        "surface-container-high": "#e5e9e6",
                        "primary-container": "#7fd8be",
                        "on-error": "#ffffff",
                        "secondary": "#146871",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#005f4d",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container": "#ebefeb",
                        "on-tertiary-container": "#38585f",
                        "inverse-surface": "#2d312f",
                        "surface-dim": "#d7dbd8",
                        "surface-variant": "#dfe3e0",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#005141",

                        "outline": "#6e7a75",
                        "surface-container-highest": "#dfe3e0",

                        "on-surface": "#181d1b",
                        "on-primary-fixed": "#002019",
                        "surface": "#f6faf7",
                        "primary-fixed": "#9af4d9",
                        "tertiary-container": "#abcdd6",

                    "borderRadius": {

                    "spacing": {

                        "lg": "24px",
                        "md": "16px",
                        "2xl": "48px",
                        "margin-mobile": "16px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Cairo"],
                        "headline-lg-mobile": ["Cairo"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 transition-opacity"></div>
<div class="relative w-full max-w-2xl bg-surface-container-lowest rounded-[24px] shadow-[0px_12px_32px_rgba(18,52,59,0.08)] z-50 overflow-hidden transform transition-all">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant/30 flex items-center justify-between bg-surface-bright">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">person_add</span>
<h2 class="font-headline-md text-headline-md text-on-surface">إضافة مدير حلقة</h2>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors rounded-full p-2 hover:bg-surface-container">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg">
<form class="space-y-xl">
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Full Name -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant">الاسم الرباعي</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline">badge</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3 pr-10 pl-4 text-on-surface font-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline-variant placeholder:font-label-md" placeholder="أدخل اسم المدير كاملاً" type="text"/>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant">رقم الهاتف</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline">call</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3 pr-10 pl-4 text-on-surface font-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline-variant placeholder:font-label-md" dir="ltr" placeholder="05x xxx xxxx" style="text-align: right;" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant">كلمة المرور</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3 pr-10 pl-10 text-on-surface font-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline-variant placeholder:font-label-md" placeholder="أدخل كلمة المرور" type="password"/>
<button class="absolute left-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Halaqa Select -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant">تعيين حلقة</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline">menu_book</span>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3 pr-10 pl-4 text-on-surface font-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all appearance-none">
<option class="text-outline-variant font-label-md" disabled="" selected="" value="">اختر الحلقة</option>
<option value="1">حلقة الإمام الشافعي - مسجد النور</option>
<option value="2">حلقة الإمام مالك - مسجد الهدى</option>
<option value="3">حلقة الإمام أحمد - مسجد التقوى</option>
</select>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
</div>
</form>
</div>
<!-- Footer -->
<div class="px-lg py-md border-t border-outline-variant/30 bg-surface-bright flex flex-row-reverse justify-end gap-md">
<button class="h-[48px] px-lg bg-gradient-to-r from-primary to-primary-container text-on-primary font-label-md text-label-md rounded-xl hover:shadow-[0px_4px_20px_rgba(0,107,87,0.15)] hover:-translate-y-[2px] transition-all flex items-center justify-center gap-xs">
<span>حفظ</span>
<span class="material-symbols-outlined text-[20px]">save</span>
</button>
<button class="h-[48px] px-lg bg-surface-container-lowest border border-outline-variant text-primary font-label-md text-label-md rounded-xl hover:bg-surface-container-low transition-all flex items-center justify-center gap-xs">
<span>إلغاء</span>
</button>
</div>
</div>
</body></html>
